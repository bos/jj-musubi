# For test priorities (below); an older nextest would ignore them, saying only that it does.
nextest-version = "0.9.148"

[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# The generated end-to-end search (tests named `e2e_search_*`) is expensive and runs only
# in the `search` profile; its quick sibling `e2e_smoke` runs by default.
default-filter = "not test(/^e2e_search_/)"

[profile.search]
default-filter = "test(/^e2e_search_/)"
slow-timeout = { period = "300s", terminate-after = 12 }

# The conformance test is the longest by far, and longer still while the rest run: start it
# first, so that it doesn't finish alone at the end.
[[profile.default.overrides]]
filter = "test(=conformance)"
priority = 100
