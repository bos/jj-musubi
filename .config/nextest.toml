# For test priorities (below); an older nextest would ignore them, saying only that it does.
nextest-version = "0.9.148"

[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# The generated end-to-end search (tests named `e2e_search_*`) is expensive and runs only
# in the `search` profile; its quick sibling `e2e_smoke` runs by default. Wrong replies with
# real repositories take half a minute, too long for every local run, and run on CI (the `ci`
# profile); the protocol core's false replies run everywhere.
default-filter = "not test(/^e2e_search_/) and not test(=lies::nodes_recover_from_wrong_replies)"

[profile.ci]
default-filter = "not test(/^e2e_search_/)"

[profile.search]
default-filter = "test(/^e2e_search_/)"
slow-timeout = { period = "300s", terminate-after = 12 }

# The conformance test is the longest by far, and longer still while the rest run: start it
# first, so that it doesn't finish alone at the end.
[[profile.default.overrides]]
filter = "test(=conformance) | test(=survivor_advance_conformance)"
priority = 100

# Keep all 150 oracle cases on CI: Linux and Windows exceeded the default two-minute
# limit while the rest of the suite ran. The local 50-case run keeps its normal limit.
[[profile.ci.overrides]]
filter = "test(=survivor_advance_conformance)"
slow-timeout = { period = "60s", terminate-after = 10 }

# The four-repository survivor seed also runs a generated walk; leave time for slower
# platforms without reducing the cases or any independent convergence/import checks.
[[profile.ci.overrides]]
filter = "test(=e2e_dropped_merge)"
slow-timeout = { period = "60s", terminate-after = 6 }

# These six four-repository cases, with separate git directories and fetched histories,
# exceed the two-minute default on Windows while the rest of the suite runs.
[[profile.ci.overrides]]
filter = "test(=history::advancing_to_what_survives_of_a_dropped_head)"
slow-timeout = { period = "60s", terminate-after = 6 }

# Each case of the per-machine refs conformance test runs real `jj`, `git` and syncs. It is
# the next longest, so it starts next; and shrinking a failure takes minutes, so it has long
# enough for Hegel to report one, which it does when it gives up shrinking at five.
[[profile.default.overrides]]
filter = "test(=refs::bookmarks_conform_to_refs_model)"
priority = 90
slow-timeout = { period = "60s", terminate-after = 6 }

# Keep every wrong-reply case on slower CI runners, and allow Hegel to finish shrinking a
# failure (up to five minutes) instead of killing it before it can report the counterexample.
[[profile.ci.overrides]]
filter = "test(=lies::nodes_recover_from_wrong_replies)"
slow-timeout = { period = "60s", terminate-after = 10 }
