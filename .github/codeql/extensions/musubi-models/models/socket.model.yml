extensions:
  # CodeQL takes anything named `uid` for account information, and taints every `Result` that
  # a `?` could pass socket::uid's error up through, so the name of a hive in a hub's reply,
  # once printed, reads as the uid logged; and every string login::boot::uid goes into, such
  # as a service's name, which tests print when they fail. A uid isn't secret, so stop its
  # taint where it starts. (Cleartext logging takes its barriers from those of log injection.)
  - addsTo:
      pack: codeql/rust-all
      extensible: barrierModel
    data:
      - ["musubi::socket::uid", "ReturnValue", "log-injection", "manual"]
      - ["musubi::login::boot::uid", "ReturnValue", "log-injection", "manual"]
