name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Pull requests test GitHub's proposed merge commit, including changes already on the base
# branch. Pushes to main also check the code that landed.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just,cargo-deny,cargo-machete,typos
      - run: just fmt-check
      - run: just lint
      - run: just docs
      - run: just deny
      - run: just machete
      - run: just typos

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            jj: jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz
            jj-sha256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
          - name: macOS
            os: macos-latest
            jj: jj-v0.46.0-aarch64-apple-darwin.tar.gz
            jj-sha256: 43daa37ce0f9716cdf6fb65a29cbcae74a3160aef048cf3cb3d166d41cb4ab58
          - name: Windows
            os: windows-latest
            jj: jj-v0.46.0-x86_64-pc-windows-msvc.zip
            jj-sha256: c42316b10df04611bc65029a18bcb2d92636edddb6871d511f7bb4233e999b83
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest,just
      # The lint job runs on Linux, which compiles none of the code for macOS or Windows.
      # Bash, so that just finds sh on Windows.
      - name: Lint
        if: runner.os != 'Linux'
        shell: bash
        run: just lint
      - name: Install jj
        shell: bash
        run: |
          .github/scripts/install-release.sh jj-vcs/jj v0.46.0 "${{ matrix.jj }}" "${{ matrix.jj-sha256 }}" jj
      - run: jj --version && git --version
      # The Lean toolchain, for the oracle that tests check the code against.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: formal
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      # Built once here: tests that each built it would race in formal/.lake.
      - name: Build the Lean oracle
        shell: bash
        working-directory: formal
        run: |
          lake build oracle
          dir=$(pwd)
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then dir=$(pwd -W); exe=.exe; fi
          echo "MUSUBI_ORACLE=$dir/.lake/build/bin/oracle$exe" >> "$GITHUB_ENV"
      # The login service test installs the daemon with systemd's user manager, which a
      # runner doesn't start without a login session.
      - name: Start a systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace --locked
        env:
          # Runners are thrown away, so the test may install a login service for real.
          MUSUBI_TEST_LOGIN_SERVICE: "1"
      # Every benchmark script, briefly, so that they keep up with the CLI.
      - name: Benchmark smoke run
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: just bench-smoke

  lean:
    name: Lean model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Lean toolchain, so that a run doesn't depend on downloading it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}
      # Checks the proofs and builds the oracle.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - run: formal/test/run_smoke.sh
