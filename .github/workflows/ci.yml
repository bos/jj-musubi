name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Pull requests test GitHub's proposed merge commit, including changes already on the base
# branch. Pushes to main also check the code that landed.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just,cargo-deny,cargo-machete,typos
      - run: just fmt-check
      - run: just lint
      - run: just docs
      - run: just deny
      - run: just machete
      - run: just typos
      - run: just fuzz-runner-test
      - run: just assurance-check

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            jj: jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz
            jj-sha256: d4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7
          - name: macOS
            os: macos-latest
            jj: jj-v0.47.1-aarch64-apple-darwin.tar.gz
            jj-sha256: 50129b527f7cd6aef82aebd4bb2b670bb56766adc509ef3279c4327aa3592255
          - name: Windows
            os: windows-latest
            jj: jj-v0.47.1-x86_64-pc-windows-msvc.zip
            jj-sha256: 72f9f80bc99d07a7f48d5f219cf5bab91f7e906e4b53f6c827948e646cd1152f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest,just
      - name: Install workspace cache tool
        if: runner.os != 'Windows'
        run: just workspace-cache-install
        env:
          CARGO_BUILD_JOBS: 2
      # The test waits for a Cargo build with no deadline of its own.
      - name: Check workspace cache helper
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: just workspace-cache-test
        env:
          CARGO_BUILD_JOBS: 2
      # The lint job runs on Linux, which compiles none of the code for macOS or Windows.
      # Bash, so that just finds sh on Windows.
      - name: Lint
        if: runner.os != 'Linux'
        shell: bash
        run: just lint
      - name: Install jj
        shell: bash
        run: |
          .github/scripts/install-release.sh jj-vcs/jj v0.47.1 "${{ matrix.jj }}" "${{ matrix.jj-sha256 }}" jj
      - run: jj --version && git --version
      # The Lean toolchain, for the oracle that tests check the code against.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: formal
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      # Built once here: tests that each built it would race in formal/.lake.
      - name: Build the Lean oracle
        shell: bash
        working-directory: formal
        run: |
          lake build oracle
          dir=$(pwd)
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then dir=$(pwd -W); exe=.exe; fi
          echo "MUSUBI_ORACLE=$dir/.lake/build/bin/oracle$exe" >> "$GITHUB_ENV"
      # The login service tests install the daemon and the hub with systemd's user manager,
      # which a runner doesn't start without a login session.
      - name: Start a systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace --locked --profile ci
        env:
          # Runners are thrown away, so tests may install login services for real.
          MUSUBI_TEST_LOGIN_SERVICE: "1"
          # Linux runners also exercise the hub's system service with passwordless sudo.
          MUSUBI_TEST_BOOT_SERVICE: ${{ runner.os == 'Linux' && '1' || '' }}
      # Every benchmark script, briefly, so that they keep up with the CLI.
      - name: Benchmark smoke run
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: just bench-smoke

  # musubi on illumos, in an OmniOS VM: GitHub has no illumos runners. Lean has no illumos
  # build, so the tests that check the code against its oracle run on the other platforms
  # only; this job lints the whole workspace, whose illumos code no other job compiles, and
  # tests the musubi crate, where the platform-specific code (SMF, sockets, processes) is.
  illumos:
    name: Test (illumos)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/omnios-vm@aeee92416495d9685b2997d954f6b063ae5b832d # v1.3.8
        with:
          # The long-term support release, with the compilers and git that building needs.
          release: "r151054-build"
          envs: CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE
          mem: 12288
          copyback: false
          # Building jj takes up most of the time that prepare does, so the VM is cached once
          # prepare has run. The cache key is derived from the prepare script, so anything
          # prepare installs has to be pinned there. Otherwise, the cache would keep an old
          # version, and nothing would show it. Things that don't need pinning, such as the Rust
          # toolchain and nextest, are updated or installed at each run instead.
          cache-after-prepare: true
          # The installers below are saved to a file before they run, rather than piped into
          # sh. That's because illumos's sh is ksh93, and its `set -e` ignores a failed
          # pipeline anywhere except at the end of a script, even with pipefail. So if a
          # download failed partway, the script would carry on as though nothing happened.
          prepare: |
            set -eux
            # The build image comes with compilers but not git, and the tests need git. pkg
            # exits with status 4 if git is already installed, so treat that as success.
            pkg install developer/versioning/git || test $? -eq 4
            curl --proto '=https' --tlsv1.2 -sSf --retry 5 -o /tmp/rustup-init.sh \
              https://sh.rustup.rs
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable \
              --component clippy
            rm /tmp/rustup-init.sh
            . "$HOME/.cargo/env"
            # The tests need the exact version of jj that musubi's jj-lib dependency is
            # (musubi_testutil::JJ_VERSION), and jj doesn't publish builds for illumos.
            cargo install --locked --version 0.47.1 jj-cli --bin jj
            # Download the crates the workspace needs now, so that each run only downloads
            # the ones Cargo.lock has gained since.
            cargo fetch --locked
          run: |
            set -eux
            . "$HOME/.cargo/env"
            rustup update stable
            # The latest nextest, as the other jobs use. The installer checks the archive's
            # SHA-256 checksum, and installs nextest into ~/.cargo/bin.
            curl --proto '=https' --tlsv1.2 -LsSf --retry 5 -o /tmp/nextest-install.sh \
              https://get.nexte.st/install.sh
            sh /tmp/nextest-install.sh
            rm /tmp/nextest-install.sh
            uname -a
            rustc --version
            jj --version
            git --version
            cargo nextest --version
            cargo clippy --workspace --all-targets --locked -- -D warnings
            # `decisions_conformance` needs the Lean oracle. `moved_copies_sync_again` fails on
            # illumos: the daemon doesn't notice a copy moved to another directory.
            # The VM is thrown away, so tests may install SMF services for real.
            MUSUBI_TEST_LOGIN_SERVICE=1 cargo nextest run --locked --profile ci -p jj-musubi \
              -E 'not test(=copy::conformance::decisions_conformance) and not test(=moved_copies_sync_again)'

  lean:
    name: Lean model and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Lean toolchain, so that a run doesn't depend on downloading it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}
      # Checks the proofs and builds the oracle.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - run: formal/test/run_smoke.sh
