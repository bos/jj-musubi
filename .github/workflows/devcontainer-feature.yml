name: Publish Dev Container Feature

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-devcontainer-feature

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish musubi Feature
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          npx --yes @devcontainers/cli@0.90.0 features publish features/musubi \
            --namespace "${GITHUB_REPOSITORY,,}"
