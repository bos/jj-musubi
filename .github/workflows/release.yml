name: Release

# Pushing a tag such as v0.1.0 builds musubi for every platform and attaches the archives to
# a draft GitHub release, to review and publish by hand. Running the workflow by hand builds
# the same archives as workflow artifacts and releases nothing.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Check the tag matches musubi's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "musubi") | .version')
          if [[ $GITHUB_REF == refs/tags/* && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match musubi's version, $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    env:
      NAME: musubi-${{ needs.version.outputs.version }}-${{ matrix.target }}
      BIN: target/${{ matrix.target }}/dist/musubi${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --profile dist --locked -p musubi --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        shell: bash
        run: '"$BIN" --version'
      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir -p "dist/$NAME"
          cp "$BIN" README.md LICENSE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          echo "ARCHIVE=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/$env:NAME" | Out-Null
          Copy-Item $env:BIN, README.md, LICENSE -Destination "dist/$env:NAME"
          Compress-Archive -Path "dist/$env:NAME" -DestinationPath "dist/$env:NAME.zip"
          "ARCHIVE=dist/$env:NAME.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum musubi-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "musubi $GITHUB_REF_NAME" --generate-notes musubi-* SHA256SUMS
