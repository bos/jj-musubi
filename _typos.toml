[files]
extend-exclude = ["formal/.lake", "target", "Cargo.lock"]

[default]
extend-ignore-re = [
    # The 32-column terminal snapshot clips ISSUES at the right edge.
    '" HEAD IN/ OUT/ OPS COMM MAC ISSU"',
    # Commit and operation ids, as antithesis/FINDINGS.md quotes them: hex that can read as a
    # word.
    '`[0-9a-f]{7,40}`',
]

[default.extend-identifiers]
# The core Lean fold homomorphism theorem.
foldr_hom = "foldr_hom"

[default.extend-words]
# The terminal UI library.
ratatui = "ratatui"
# The Lean model's names: `Anc` is ancestry (`anc*`), `nd` a node, `hed` a head, `hax` that
# `a` is below `x`.
anc = "anc"
Anc = "Anc"
nd = "nd"
hed = "hed"
hax = "hax"
# SMF's restarter is called svc.startd, and SMF manifests have a `startd` property group.
startd = "startd"
# GitHub's anchors for headings that say "repository's" and "copy's".
repositorys = "repositorys"
copys = "copys"
