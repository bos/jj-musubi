[package]
name = "musubi-antithesis-driver"
version = "0.0.0"
edition = "2024"
publish = false
description = "The Antithesis workload's driver: jj and musubi commands on machines over ssh"
license = "Apache-2.0"

# Its own workspace: the repository's never builds it (antithesis/README.md).
[workspace]

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
antithesis-instrumentation = "0.1.1"
antithesis_sdk = { version = "0.4.0", default-features = false, features = ["full"] }
# The latest release, not the workspace's 0.52.6, which is pinned so that saved failures
# replay: Antithesis reproduces a workload's failures itself.
hegeltest = "0.54.0"
serde_json = "1"

# The crate is imported as `hegel`, which cargo-machete doesn't follow.
[package.metadata.cargo-machete]
ignored = ["hegeltest"]
