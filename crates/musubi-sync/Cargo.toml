[package]
name = "musubi-sync"
description = "Internal to jj-musubi (no stable API): the protocol core, bound to repositories and hub storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
jj-lib.workspace = true
musubi-core.workspace = true
musubi-hub.workspace = true
musubi-jj.workspace = true
musubi-transport.workspace = true
postcard.workspace = true
serde.workspace = true
serde_bytes.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
hegeltest.workspace = true
musubi-testutil.workspace = true
reflink-copy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "io-util"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Used only by name, in serde attributes, which cargo-machete doesn't read.
ignored = ["serde_bytes"]
