[package]
name = "musubi-testutil"
description = "Test helpers for jj-musubi: hermetic jj repositories driven through the jj CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# No tests of its own: a test binary would only be linked with jj-lib for nothing.
[lib]
test = false
doctest = false

[dependencies]
jj-lib.workspace = true
reflink-copy.workspace = true
tempfile.workspace = true

[lints]
workspace = true
