[package]
name = "jj-musubi"
description = "Replicate jj repositories between machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["jj", "jujutsu", "vcs", "sync"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "musubi"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
etcetera.workspace = true
futures.workspace = true
interprocess.workspace = true
jj-cli.workspace = true
jj-lib.workspace = true
musubi-hub.workspace = true
musubi-jj.workspace = true
musubi-sync.workspace = true
musubi-transport.workspace = true
notify.workspace = true
pollster.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tarpc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
whoami.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true

[dev-dependencies]
musubi-testutil.workspace = true

[lints]
workspace = true
