[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    # interprocess and its helpers, for the daemon's control socket; public-domain-like.
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    # terminfo, via jj-cli's pager; jj allows it too.
    "WTFPL",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
